name: Test pipeline CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
      
      # Runs commands using the runners shell
      - name: Building dependency Docker container
        # Builds here the Docker container
        run: docker build . --file Dockerfile --tag ksrates

      - name: Set Java 17 Environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Installing Nextflow
        run: |
          sudo apt-get update
          sudo apt-get install wget openjdk-17-jdk
          sudo wget -qO- https://get.nextflow.io | bash
          sudo mv nextflow /usr/bin

      - name: Start sqld server for the paralog Ks database test
        # Runs with --network host (rather than GH Actions' "services:" feature) so that the
        # containers Nextflow's docker executor spawns for each ksrates step - which sit on
        # Docker's default bridge network, per test/nextflow.config's docker.runOptions, not
        # whatever network "services:" would use - can still reach it, via the bridge gateway
        # IP that a host-networked process is reachable at from any bridge-networked container.
        #
        # No auth is configured here, unlike the real cluster deployment's JWT setup: this
        # server only lives for this one ephemeral CI job and isn't reachable by anyone else,
        # so the "reachable by every job on a shared cluster network" risk that JWT auth exists
        # for doesn't apply. fc_consolidate_paralog_ks.py already treats a missing second
        # (token) line in the address file as "no auth needed".
        #
        # The database directory is bind-mounted under test/ (rather than left inside the
        # container's own writable layer) purely so it rides along with the "Test output
        # files" artifact upload below, which already captures the whole test/ directory.
        run: |
          mkdir -p test/paralog_ks_database
          docker run -d --network host --name sqld_ci \
            -v "$PWD/test/paralog_ks_database:/var/lib/sqld" \
            ghcr.io/tursodatabase/libsql-server:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          BRIDGE_GATEWAY=$(docker network inspect bridge --format '{{ (index .IPAM.Config 0).Gateway }}')
          echo "${BRIDGE_GATEWAY}:8080" > test/config_files/paralog_ks_server_address.txt
          cat test/config_files/paralog_ks_server_address.txt

      - name: Running ksrates Nextflow pipeline
        run: |
          cd test
          NXF_VER=24.10.5 nextflow run ../main.nf --test -profile docker --config config_files/config_elaeis.txt --expert config_files/config_expert.txt -with-docker ksrates

      - name: Export human-readable paralog Ks database dump
        # Runs before the sqld server is stopped, and even if the pipeline step above failed
        # (still useful for debugging a partial run). Reuses the same "ksrates" image already
        # built above; the "ksrates" command is on PATH there as a proper console script
        # (setup.py entry_points), same as end users get from a real install.
        if: ${{ always() }}
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ksrates \
            ksrates inspect-paralog-ks-db test/config_files/paralog_ks_server_address.txt

      - name: Stop sqld server
        if: ${{ always() }}
        run: docker stop sqld_ci

      - name: Visualize output files
        if: ${{ always() }}
        run: ls -l test/rate_adjustment/elaeis

      - uses: actions/upload-artifact@v4
        name: Test output files
        if: ${{ always() }}
        with:
          name: ksrates_test_pipeline_output
          path: test